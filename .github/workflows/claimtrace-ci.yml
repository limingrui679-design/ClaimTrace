name: ClaimTrace CI

on:
  push:
    paths:
      - "app/**"
      - "benchmarks/**"
      - "build/**"
      - "docs/**"
      - "public/**"
      - "schemas/**"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/claimtrace-ci.yml"
      - ".openai/hosting.json"
      - ".gitignore"
      - "CHANGELOG.md"
      - "LICENSE"
      - "README.md"
      - "eslint.config.mjs"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "playwright*.config.ts"
      - "tsconfig.json"
      - "vite.config.ts"
      - "wrangler.jsonc"
  pull_request:
    paths:
      - "app/**"
      - "benchmarks/**"
      - "build/**"
      - "docs/**"
      - "public/**"
      - "schemas/**"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/claimtrace-ci.yml"
      - ".openai/hosting.json"
      - ".gitignore"
      - "CHANGELOG.md"
      - "LICENSE"
      - "README.md"
      - "eslint.config.mjs"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "playwright*.config.ts"
      - "tsconfig.json"
      - "vite.config.ts"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Lint and type-check
        run: npm run lint && npm run typecheck

      - name: Regenerate deterministic artifacts
        run: npm run demo:generate && npm run cases:generate && npm run benchmark

      - name: Reject stale generated artifacts
        run: git diff --exit-code -- public/demo-data public/cases app/demo-case.generated.ts benchmarks/results.json

      - name: Build and run the full test suite
        run: npm test && npm run test:browser

      - name: Enforce core coverage thresholds
        run: npm run test:coverage

      - name: Audit production and development dependencies
        run: npm audit --omit=dev --audit-level=high && npm audit --audit-level=high

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimtrace-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser-test reports and traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimtrace-browser-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
