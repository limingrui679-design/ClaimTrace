<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ClaimTrace local-first system architecture</title>
  <desc id="desc">Versioned inputs enter application workflows, flow through a deterministic audit core, and produce independently verifiable AuditBundle and HTML outputs. Tests and executable cases surround the core.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b2c"/>
      <stop offset="1" stop-color="#0d2d43"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#071b2c" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#28c3ad"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="28" fill="#f3f7f8"/>
  <path d="M28 0h1544a28 28 0 0 1 28 28v168H0V28A28 28 0 0 1 28 0z" fill="url(#header)"/>
  <text x="56" y="68" fill="#28c3ad" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750" letter-spacing="1.5">LOCAL-FIRST SYSTEM ARCHITECTURE</text>
  <text x="56" y="124" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="760">The interface renders audit truth; it does not own it.</text>
  <text x="1544" y="76" fill="#d4ad6c" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="end">DETERMINISTIC CORE · PORTABLE EVIDENCE</text>

  <g stroke="#28c3ad" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M314 462H354"/>
    <path d="M1246 462H1286"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(55 228)">
      <rect width="260" height="500" rx="22" fill="#ffffff" stroke="#d9e5e9" stroke-width="2"/>
      <rect width="260" height="72" rx="22" fill="#0b2235"/>
      <path d="M0 50h260v22H0z" fill="#0b2235"/>
      <text x="24" y="44" fill="#ffffff" font-size="22" font-weight="750">Versioned inputs</text>

      <g transform="translate(22 102)">
        <rect width="216" height="88" rx="16" fill="#e7f6f3"/>
        <text x="18" y="32" fill="#0b8f79" font-size="14" font-weight="750">CSV SNAPSHOTS</text>
        <text x="18" y="61" fill="#0b2235" font-size="19" font-weight="700">Baseline + current</text>
      </g>
      <g transform="translate(22 212)">
        <rect width="216" height="88" rx="16" fill="#edf3f6"/>
        <text x="18" y="32" fill="#3074a7" font-size="14" font-weight="750">CASE PACKS</text>
        <text x="18" y="61" fill="#0b2235" font-size="19" font-weight="700">4 synthetic + 6 public</text>
      </g>
      <g transform="translate(22 322)">
        <rect width="216" height="112" rx="16" fill="#faf2e4"/>
        <text x="18" y="32" fill="#9b641b" font-size="14" font-weight="750">PROVENANCE</text>
        <text x="18" y="62" fill="#0b2235" font-size="18" font-weight="700">Source responses,</text>
        <text x="18" y="88" fill="#0b2235" font-size="18" font-weight="700">rules + prior identity</text>
      </g>
      <text x="24" y="472" fill="#496572" font-size="15">Files stay in the browser session.</text>
    </g>

    <g transform="translate(355 208)">
      <rect width="890" height="558" rx="24" fill="#ffffff" stroke="#cfe0e6" stroke-width="2"/>
      <text x="28" y="42" fill="#496572" font-size="16" font-weight="750" letter-spacing="1.2">APPLICATION + AUDIT CORE</text>

      <g transform="translate(28 68)">
        <rect width="834" height="124" rx="18" fill="#0b2235"/>
        <text x="24" y="35" fill="#28c3ad" font-size="15" font-weight="750">APP / PRESENTATION + WORKFLOWS</text>
        <text x="24" y="72" fill="#ffffff" font-size="22" font-weight="750">Views</text>
        <text x="24" y="100" fill="#b9d3df" font-size="17">overview · data · claims · decisions · review · report</text>
        <line x1="397" y1="22" x2="397" y2="102" stroke="#315064" stroke-width="2"/>
        <text x="425" y="72" fill="#ffffff" font-size="22" font-weight="750">Workflow coordinator</text>
        <text x="425" y="100" fill="#b9d3df" font-size="17">dataset intent · case load · CSV import · verified export</text>
      </g>

      <g transform="translate(28 222)">
        <rect width="834" height="276" rx="18" fill="#f7fafb" stroke="#d9e5e9" stroke-width="2"/>
        <text x="24" y="34" fill="#0b8f79" font-size="15" font-weight="750">SRC / DETERMINISTIC CORE</text>

        <g transform="translate(24 58)">
          <rect width="246" height="82" rx="14" fill="#ffffff" stroke="#cfe5df" stroke-width="2"/>
          <text x="18" y="31" fill="#0b8f79" font-size="14" font-weight="750">SNAPSHOT</text>
          <text x="18" y="58" fill="#0b2235" font-size="18" font-weight="700">CSV · keys · hashes</text>
        </g>
        <g transform="translate(294 58)">
          <rect width="246" height="82" rx="14" fill="#ffffff" stroke="#cfe5df" stroke-width="2"/>
          <text x="18" y="31" fill="#0b8f79" font-size="14" font-weight="750">CLAIMS + VALIDATION</text>
          <text x="18" y="58" fill="#0b2235" font-size="18" font-weight="700">rules · status · evidence</text>
        </g>
        <g transform="translate(564 58)">
          <rect width="246" height="82" rx="14" fill="#ffffff" stroke="#e8d9bd" stroke-width="2"/>
          <text x="18" y="31" fill="#9b641b" font-size="14" font-weight="750">DECISIONS</text>
          <text x="18" y="58" fill="#0b2235" font-size="18" font-weight="700">actions · options · change</text>
        </g>

        <g transform="translate(24 164)">
          <rect width="246" height="82" rx="14" fill="#ffffff" stroke="#d7e4e9" stroke-width="2"/>
          <text x="18" y="31" fill="#3074a7" font-size="14" font-weight="750">STATISTICS</text>
          <text x="18" y="58" fill="#0b2235" font-size="18" font-weight="700">denominators · ties · diffs</text>
        </g>
        <g transform="translate(294 164)">
          <rect width="246" height="82" rx="14" fill="#ffffff" stroke="#e8d9bd" stroke-width="2"/>
          <text x="18" y="31" fill="#9b641b" font-size="14" font-weight="750">GOVERNANCE</text>
          <text x="18" y="58" fill="#0b2235" font-size="18" font-weight="700">review · release · chain</text>
        </g>
        <g transform="translate(564 164)">
          <rect width="246" height="82" rx="14" fill="#ffffff" stroke="#cfe5df" stroke-width="2"/>
          <text x="18" y="31" fill="#0b8f79" font-size="14" font-weight="750">EVIDENCE + INTEGRITY</text>
          <text x="18" y="58" fill="#0b2235" font-size="18" font-weight="700">recompute · verify · export</text>
        </g>
      </g>
      <text x="445" y="535" fill="#496572" font-size="16" text-anchor="middle">Executable cases and tests call the same core used by the browser workspace.</text>
    </g>

    <g transform="translate(1286 228)">
      <rect width="259" height="500" rx="22" fill="#ffffff" stroke="#d9e5e9" stroke-width="2"/>
      <rect width="259" height="72" rx="22" fill="#0b2235"/>
      <path d="M0 50h259v22H0z" fill="#0b2235"/>
      <text x="24" y="44" fill="#ffffff" font-size="22" font-weight="750">Verified outputs</text>

      <g transform="translate(22 102)">
        <rect width="215" height="94" rx="16" fill="#e7f6f3"/>
        <text x="18" y="33" fill="#0b8f79" font-size="14" font-weight="750">AUDITBUNDLE</text>
        <text x="18" y="63" fill="#0b2235" font-size="19" font-weight="700">Portable JSON evidence</text>
      </g>
      <g transform="translate(22 220)">
        <rect width="215" height="94" rx="16" fill="#edf3f6"/>
        <text x="18" y="33" fill="#3074a7" font-size="14" font-weight="750">REPORT</text>
        <text x="18" y="63" fill="#0b2235" font-size="19" font-weight="700">Print-ready HTML</text>
      </g>
      <g transform="translate(22 338)">
        <rect width="215" height="94" rx="16" fill="#faf2e4"/>
        <text x="18" y="33" fill="#9b641b" font-size="14" font-weight="750">REVIEW STATE</text>
        <text x="18" y="63" fill="#0b2235" font-size="19" font-weight="700">Hash-chained records</text>
      </g>
      <text x="24" y="472" fill="#496572" font-size="15">Rebuilt before export.</text>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="55" y="792" width="420" height="54" rx="17" fill="#edf3f6"/>
    <text x="265" y="826" fill="#3074a7" font-size="17" font-weight="750" text-anchor="middle">64 benchmark scenarios · 512 property trials</text>
    <rect x="500" y="792" width="380" height="54" rx="17" fill="#e7f6f3"/>
    <text x="690" y="826" fill="#0b8f79" font-size="17" font-weight="750" text-anchor="middle">10 independently verified case packs</text>
    <rect x="905" y="792" width="640" height="54" rx="17" fill="#faf2e4"/>
    <text x="1225" y="826" fill="#9b641b" font-size="17" font-weight="750" text-anchor="middle">Integrity is not authentication, source truth, or production governance</text>
  </g>
</svg>
