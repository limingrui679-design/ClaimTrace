<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">ClaimTrace versioned evidence pipeline</title>
  <desc id="desc">A six-step pipeline from source data through snapshots, keyed differences, claim audits, decision audits, and a verified AuditBundle, followed by explicit review outcomes.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b2c"/>
      <stop offset="1" stop-color="#0d2d43"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#071b2c" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#28c3ad"/>
    </marker>
  </defs>

  <rect width="1600" height="800" rx="28" fill="#f3f7f8"/>
  <path d="M28 0h1544a28 28 0 0 1 28 28v166H0V28A28 28 0 0 1 28 0z" fill="url(#header)"/>
  <rect x="56" y="40" width="190" height="36" rx="18" fill="#0b8f79"/>
  <text x="151" y="65" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="1.4">CLAIMTRACE</text>
  <text x="56" y="122" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="750">A changed source must re-earn every downstream claim.</text>
  <text x="56" y="163" fill="#b9d3df" font-family="Inter, Arial, sans-serif" font-size="23">Versioned evidence is propagated through claims, decisions, review state, and export integrity.</text>
  <text x="1544" y="65" fill="#d4ad6c" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="end" letter-spacing="1.2">VERSIONED EVIDENCE PIPELINE</text>

  <g stroke="#28c3ad" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M278 375H300"/>
    <path d="M528 375H550"/>
    <path d="M778 375H800"/>
    <path d="M1028 375H1050"/>
    <path d="M1278 375H1300"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(55 255)">
      <rect width="223" height="240" rx="20" fill="#ffffff" stroke="#d9e5e9" stroke-width="2"/>
      <circle cx="36" cy="38" r="20" fill="#0b8f79"/>
      <text x="36" y="45" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle">1</text>
      <text x="22" y="95" fill="#0b2235" font-size="25" font-weight="750">Source data</text>
      <text x="22" y="135" fill="#496572" font-size="19">
        <tspan x="22" dy="0">Versioned CSV or</tspan>
        <tspan x="22" dy="28">pinned public source</tspan>
      </text>
      <rect x="22" y="197" width="102" height="24" rx="12" fill="#e7f6f3"/>
      <text x="73" y="214" fill="#0b8f79" font-size="14" font-weight="700" text-anchor="middle">PROVENANCE</text>
    </g>

    <g transform="translate(305 255)">
      <rect width="223" height="240" rx="20" fill="#ffffff" stroke="#d9e5e9" stroke-width="2"/>
      <circle cx="36" cy="38" r="20" fill="#0b8f79"/>
      <text x="36" y="45" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle">2</text>
      <text x="22" y="95" fill="#0b2235" font-size="25" font-weight="750">Snapshot</text>
      <text x="22" y="135" fill="#496572" font-size="19">
        <tspan x="22" dy="0">Raw + normalized hash,</tspan>
        <tspan x="22" dy="28">schema, captured time</tspan>
      </text>
      <rect x="22" y="197" width="92" height="24" rx="12" fill="#edf3f6"/>
      <text x="68" y="214" fill="#3074a7" font-size="14" font-weight="700" text-anchor="middle">IDENTITY</text>
    </g>

    <g transform="translate(555 255)">
      <rect width="223" height="240" rx="20" fill="#ffffff" stroke="#d9e5e9" stroke-width="2"/>
      <circle cx="36" cy="38" r="20" fill="#0b8f79"/>
      <text x="36" y="45" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle">3</text>
      <text x="22" y="95" fill="#0b2235" font-size="25" font-weight="750">Keyed diff</text>
      <text x="22" y="135" fill="#496572" font-size="19">
        <tspan x="22" dy="0">Added, removed, and</tspan>
        <tspan x="22" dy="28">changed records</tspan>
      </text>
      <rect x="22" y="197" width="108" height="24" rx="12" fill="#e7f6f3"/>
      <text x="76" y="214" fill="#0b8f79" font-size="14" font-weight="700" text-anchor="middle">PRIMARY KEY</text>
    </g>

    <g transform="translate(805 255)">
      <rect width="223" height="240" rx="20" fill="#ffffff" stroke="#d9e5e9" stroke-width="2"/>
      <circle cx="36" cy="38" r="20" fill="#b77a24"/>
      <text x="36" y="45" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle">4</text>
      <text x="22" y="95" fill="#0b2235" font-size="25" font-weight="750">Claim audit</text>
      <text x="22" y="135" fill="#496572" font-size="19">
        <tspan x="22" dy="0">Metric, denominator,</tspan>
        <tspan x="22" dy="28">rule, threshold source</tspan>
      </text>
      <rect x="22" y="197" width="112" height="24" rx="12" fill="#faf2e4"/>
      <text x="78" y="214" fill="#9b641b" font-size="14" font-weight="700" text-anchor="middle">EXECUTABLE</text>
    </g>

    <g transform="translate(1055 255)">
      <rect width="223" height="240" rx="20" fill="#ffffff" stroke="#d9e5e9" stroke-width="2"/>
      <circle cx="36" cy="38" r="20" fill="#b77a24"/>
      <text x="36" y="45" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle">5</text>
      <text x="22" y="95" fill="#0b2235" font-size="25" font-weight="750">Decision audit</text>
      <text x="22" y="135" fill="#496572" font-size="19">
        <tspan x="22" dy="0">Action identity, options,</tspan>
        <tspan x="22" dy="28">constraints, stability</tspan>
      </text>
      <rect x="22" y="197" width="104" height="24" rx="12" fill="#faf2e4"/>
      <text x="74" y="214" fill="#9b641b" font-size="14" font-weight="700" text-anchor="middle">GOVERNED</text>
    </g>

    <g transform="translate(1305 255)">
      <rect width="223" height="240" rx="20" fill="#ffffff" stroke="#28c3ad" stroke-width="3"/>
      <circle cx="36" cy="38" r="20" fill="#0b8f79"/>
      <text x="36" y="45" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle">6</text>
      <text x="22" y="95" fill="#0b2235" font-size="25" font-weight="750">AuditBundle</text>
      <text x="22" y="135" fill="#496572" font-size="19">
        <tspan x="22" dy="0">Verified JSON + HTML,</tspan>
        <tspan x="22" dy="28">review chain + hashes</tspan>
      </text>
      <rect x="22" y="197" width="98" height="24" rx="12" fill="#e7f6f3"/>
      <text x="71" y="214" fill="#0b8f79" font-size="14" font-weight="700" text-anchor="middle">PORTABLE</text>
    </g>
  </g>

  <rect x="55" y="555" width="1473" height="150" rx="22" fill="#0b2235"/>
  <text x="85" y="594" fill="#b9d3df" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.2">EXPLICIT TERMINAL STATES</text>
  <g font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" text-anchor="middle">
    <g transform="translate(86 617)"><rect width="216" height="50" rx="15" fill="#e7f6f3"/><text x="108" y="32" fill="#0b8f79">CLAIM VALID</text></g>
    <g transform="translate(326 617)"><rect width="216" height="50" rx="15" fill="#faf2e4"/><text x="108" y="32" fill="#9b641b">CLAIM WEAKENED</text></g>
    <g transform="translate(566 617)"><rect width="216" height="50" rx="15" fill="#f9e9e9"/><text x="108" y="32" fill="#b23d3d">CLAIM INVALID</text></g>
    <g transform="translate(806 617)"><rect width="216" height="50" rx="15" fill="#edf3f6"/><text x="108" y="32" fill="#3074a7">REVIEW REQUIRED</text></g>
    <g transform="translate(1046 617)"><rect width="216" height="50" rx="15" fill="#faf2e4"/><text x="108" y="32" fill="#9b641b">DECISION CHANGED</text></g>
    <g transform="translate(1286 617)"><rect width="216" height="50" rx="15" fill="#e7f6f3"/><text x="108" y="32" fill="#0b8f79">RE-SIGN REQUIRED</text></g>
  </g>
  <text x="800" y="754" fill="#496572" font-family="Inter, Arial, sans-serif" font-size="18" text-anchor="middle">Integrity checks prove package consistency — not source truth, reviewer identity, or production deployment.</text>
</svg>
