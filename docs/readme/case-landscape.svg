<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ClaimTrace reproducible case portfolio</title>
  <desc id="desc">Four deterministic synthetic stress fixtures and six provenance-bound public-data cases across operations, finance, health, planning, transportation, consumer complaints, housing, and international indicators.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b2c"/>
      <stop offset="1" stop-color="#0d2d43"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="145%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#071b2c" flood-opacity="0.11"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="28" fill="#f3f7f8"/>
  <path d="M28 0h1544a28 28 0 0 1 28 28v166H0V28A28 28 0 0 1 28 0z" fill="url(#header)"/>
  <text x="56" y="76" fill="#28c3ad" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750" letter-spacing="1.5">REPRODUCIBLE CASE PORTFOLIO</text>
  <text x="56" y="129" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="760">Ten cases, two evidence roles.</text>
  <text x="1544" y="80" fill="#d4ad6c" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="end">4 SYNTHETIC + 6 PUBLIC DATA</text>
  <text x="1544" y="126" fill="#b9d3df" font-family="Inter, Arial, sans-serif" font-size="19" text-anchor="end">Controlled failure modes + source-bound lineage</text>

  <rect x="58" y="212" width="716" height="602" rx="24" fill="#ffffff" stroke="#d9e5e9" stroke-width="2"/>
  <rect x="826" y="212" width="716" height="602" rx="24" fill="#ffffff" stroke="#d9e5e9" stroke-width="2"/>

  <rect x="90" y="243" width="292" height="38" rx="19" fill="#edf3f6"/>
  <text x="236" y="268" fill="#3074a7" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" text-anchor="middle" letter-spacing="0.8">DETERMINISTIC STRESS FIXTURES</text>
  <text x="742" y="268" fill="#496572" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="end">4 CASES</text>

  <rect x="858" y="243" width="272" height="38" rx="19" fill="#e7f6f3"/>
  <text x="994" y="268" fill="#0b8f79" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" text-anchor="middle" letter-spacing="0.8">PINNED PUBLIC DATA</text>
  <text x="1510" y="268" fill="#496572" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="end">6 CASES</text>

  <g font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(90 315)">
      <rect width="315" height="168" rx="18" fill="#f8fafb" stroke="#d7e4e9" stroke-width="2"/>
      <rect width="8" height="168" rx="4" fill="#3074a7"/>
      <text x="28" y="43" fill="#3074a7" font-size="16" font-weight="750">OPERATIONS</text>
      <text x="28" y="82" fill="#0b2235" font-size="26" font-weight="750">Business operations</text>
      <text x="28" y="119" fill="#496572" font-size="19">Ranking + SLA changes</text>
      <text x="28" y="145" fill="#496572" font-size="19">and resource allocation</text>
    </g>
    <g transform="translate(430 315)">
      <rect width="315" height="168" rx="18" fill="#f8fafb" stroke="#d7e4e9" stroke-width="2"/>
      <rect width="8" height="168" rx="4" fill="#3074a7"/>
      <text x="28" y="43" fill="#3074a7" font-size="16" font-weight="750">RISK</text>
      <text x="28" y="82" fill="#0b2235" font-size="26" font-weight="750">Financial risk</text>
      <text x="28" y="119" fill="#496572" font-size="19">Probability, membership,</text>
      <text x="28" y="145" fill="#496572" font-size="19">missingness + thresholds</text>
    </g>
    <g transform="translate(90 515)">
      <rect width="315" height="168" rx="18" fill="#f8fafb" stroke="#d7e4e9" stroke-width="2"/>
      <rect width="8" height="168" rx="4" fill="#3074a7"/>
      <text x="28" y="43" fill="#3074a7" font-size="16" font-weight="750">HEALTH</text>
      <text x="28" y="82" fill="#0b2235" font-size="26" font-weight="750">Population health</text>
      <text x="28" y="119" fill="#496572" font-size="19">Risk, recall, follow-up</text>
      <text x="28" y="145" fill="#496572" font-size="19">and model gating</text>
    </g>
    <g transform="translate(430 515)">
      <rect width="315" height="168" rx="18" fill="#f8fafb" stroke="#d7e4e9" stroke-width="2"/>
      <rect width="8" height="168" rx="4" fill="#3074a7"/>
      <text x="28" y="43" fill="#3074a7" font-size="16" font-weight="750">PLANNING</text>
      <text x="28" y="82" fill="#0b2235" font-size="26" font-weight="750">Spatial planning</text>
      <text x="28" y="119" fill="#496572" font-size="19">Demand, travel time,</text>
      <text x="28" y="145" fill="#496572" font-size="19">risk + site selection</text>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(858 305)">
      <rect width="315" height="136" rx="18" fill="#f8fafb" stroke="#cfe5df" stroke-width="2"/>
      <rect width="8" height="136" rx="4" fill="#0b8f79"/>
      <text x="28" y="37" fill="#0b8f79" font-size="15" font-weight="750">WORLD BANK</text>
      <text x="28" y="75" fill="#0b2235" font-size="25" font-weight="750">Life expectancy</text>
      <text x="28" y="109" fill="#496572" font-size="18">Cross-year indicator audit</text>
    </g>
    <g transform="translate(1198 305)">
      <rect width="315" height="136" rx="18" fill="#f8fafb" stroke="#cfe5df" stroke-width="2"/>
      <rect width="8" height="136" rx="4" fill="#0b8f79"/>
      <text x="28" y="37" fill="#0b8f79" font-size="15" font-weight="750">USDOT / FTA</text>
      <text x="28" y="75" fill="#0b2235" font-size="25" font-weight="750">Transit operations</text>
      <text x="28" y="109" fill="#496572" font-size="18">Ridership + service intensity</text>
    </g>
    <g transform="translate(858 467)">
      <rect width="315" height="136" rx="18" fill="#f8fafb" stroke="#cfe5df" stroke-width="2"/>
      <rect width="8" height="136" rx="4" fill="#0b8f79"/>
      <text x="28" y="37" fill="#0b8f79" font-size="15" font-weight="750">U.S. TREASURY</text>
      <text x="28" y="75" fill="#0b2235" font-size="25" font-weight="750">Yield curve</text>
      <text x="28" y="109" fill="#496572" font-size="18">Period + curve-shape audit</text>
    </g>
    <g transform="translate(1198 467)">
      <rect width="315" height="136" rx="18" fill="#f8fafb" stroke="#cfe5df" stroke-width="2"/>
      <rect width="8" height="136" rx="4" fill="#0b8f79"/>
      <text x="28" y="37" fill="#0b8f79" font-size="15" font-weight="750">CFPB</text>
      <text x="28" y="75" fill="#0b2235" font-size="25" font-weight="750">Card complaints</text>
      <text x="28" y="109" fill="#496572" font-size="18">Issue ranking + share changes</text>
    </g>
    <g transform="translate(858 629)">
      <rect width="315" height="136" rx="18" fill="#f8fafb" stroke="#cfe5df" stroke-width="2"/>
      <rect width="8" height="136" rx="4" fill="#0b8f79"/>
      <text x="28" y="37" fill="#0b8f79" font-size="15" font-weight="750">CDC PLACES</text>
      <text x="28" y="75" fill="#0b2235" font-size="25" font-weight="750">Depression estimates</text>
      <text x="28" y="109" fill="#496572" font-size="18">Selected-county release audit</text>
    </g>
    <g transform="translate(1198 629)">
      <rect width="315" height="136" rx="18" fill="#f8fafb" stroke="#cfe5df" stroke-width="2"/>
      <rect width="8" height="136" rx="4" fill="#0b8f79"/>
      <text x="28" y="37" fill="#0b8f79" font-size="15" font-weight="750">ONS</text>
      <text x="28" y="75" fill="#0b2235" font-size="25" font-weight="750">Housing affordability</text>
      <text x="28" y="109" fill="#496572" font-size="18">Selected-authority period audit</text>
    </g>
  </g>

  <text x="800" y="858" fill="#496572" font-family="Inter, Arial, sans-serif" font-size="19" text-anchor="middle">Each case includes executable specifications, two snapshots, expected results, a manifest, documentation, and a verified AuditBundle.</text>
</svg>
