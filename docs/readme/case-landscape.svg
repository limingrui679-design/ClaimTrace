<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">ClaimTrace ten-case reproducible portfolio</title>
  <desc id="desc">A detailed comparison of four controlled synthetic stress fixtures and six pinned public-data cases. Each card names its primary key, governed checks, committed regression outcome, and downstream decision.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b2c"/>
      <stop offset="1" stop-color="#0d2d43"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="145%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#071b2c" flood-opacity="0.10"/>
    </filter>
    <style>
      .sans { font-family: Inter, Arial, sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 750; letter-spacing: 0.7px; }
      .card-title { fill: #0b2235; font-size: 23px; font-weight: 750; }
      .meta { fill: #496572; font-size: 15.5px; }
      .result { fill: #0b2235; font-size: 15.5px; font-weight: 700; }
      .decision { fill: #496572; font-size: 15px; }
      .card-bg { fill: #fbfcfd; stroke-width: 2; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1600" height="1200" rx="28" fill="#f3f7f8"/>
  <path d="M28 0h1544a28 28 0 0 1 28 28v164H0V28A28 28 0 0 1 28 0z" fill="url(#header)"/>
  <text x="56" y="58" fill="#28c3ad" class="sans" font-size="18" font-weight="750" letter-spacing="1.5">REPRODUCIBLE CASE PORTFOLIO</text>
  <text x="56" y="126" fill="#ffffff" class="sans" font-size="42" font-weight="760">Ten cases trace data changes into claims and decisions.</text>
  <text x="1544" y="54" fill="#d4ad6c" class="sans" font-size="22" font-weight="700" text-anchor="end">4 CONTROLLED + 6 PUBLIC</text>
  <text x="1544" y="84" fill="#b9d3df" class="sans" font-size="17" text-anchor="end">key · checks · committed outcome · decision</text>

  <rect x="58" y="205" width="716" height="840" rx="24" fill="#ffffff" stroke="#d9e5e9" stroke-width="2"/>
  <rect x="826" y="205" width="716" height="840" rx="24" fill="#ffffff" stroke="#d9e5e9" stroke-width="2"/>

  <rect x="90" y="236" width="292" height="38" rx="19" fill="#edf3f6"/>
  <text x="236" y="261" fill="#3074a7" class="sans" font-size="16" font-weight="750" text-anchor="middle" letter-spacing="0.8">CONTROLLED STRESS FIXTURES</text>
  <text x="742" y="261" fill="#496572" class="sans" font-size="19" font-weight="700" text-anchor="end">4 CASES</text>
  <text x="90" y="294" fill="#6a7f89" class="sans" font-size="16">Exact labels isolate edge conditions without claiming real-world outcomes.</text>

  <rect x="858" y="236" width="270" height="38" rx="19" fill="#e7f6f3"/>
  <text x="993" y="261" fill="#0b8f79" class="sans" font-size="16" font-weight="750" text-anchor="middle" letter-spacing="0.8">PINNED PUBLIC DATA</text>
  <text x="1510" y="261" fill="#496572" class="sans" font-size="19" font-weight="700" text-anchor="end">6 CASES</text>
  <text x="858" y="294" fill="#6a7f89" class="sans" font-size="16">Publisher responses, cleaning rules and hashes retained for reruns.</text>

  <!-- Controlled fixtures -->
  <g class="sans" transform="translate(90 318)">
    <rect class="card-bg" width="315" height="194" rx="18" stroke="#d7e4e9"/>
    <rect width="8" height="194" rx="4" fill="#3074a7"/>
    <text x="28" y="29" fill="#3074a7" class="eyebrow">SYNTHETIC · OPERATIONS</text>
    <text x="28" y="62" class="card-title">Business operations</text>
    <text x="28" y="92" class="meta">Primary key · channel_id</text>
    <text x="28" y="120" class="meta">Checks · rank · SLA · volume stability</text>
    <text x="28" y="154" class="result">Committed · 2 claims reversed</text>
    <text x="28" y="178" class="decision">Decision · allocation action changed</text>
  </g>

  <g class="sans" transform="translate(430 318)">
    <rect class="card-bg" width="315" height="194" rx="18" stroke="#d7e4e9"/>
    <rect width="8" height="194" rx="4" fill="#3074a7"/>
    <text x="28" y="29" fill="#3074a7" class="eyebrow">SYNTHETIC · FINANCE</text>
    <text x="28" y="62" class="card-title">Financial risk</text>
    <text x="28" y="92" class="meta">Primary key · account_id</text>
    <text x="28" y="120" class="meta">Checks · mean PD · sample · thresholds</text>
    <text x="28" y="154" class="result">Committed · 3 claims reversed</text>
    <text x="28" y="178" class="decision">Decision · admission action changed</text>
  </g>

  <g class="sans" transform="translate(90 540)">
    <rect class="card-bg" width="315" height="194" rx="18" stroke="#d7e4e9"/>
    <rect width="8" height="194" rx="4" fill="#3074a7"/>
    <text x="28" y="29" fill="#3074a7" class="eyebrow">SYNTHETIC · HEALTH + LINEAGE</text>
    <text x="28" y="62" class="card-title">Population health</text>
    <text x="28" y="92" class="meta">Primary key · row_id</text>
    <text x="28" y="120" class="meta">Checks · risk rank · recall · follow-up</text>
    <text x="28" y="154" class="result">Committed · 2 claims reversed</text>
    <text x="28" y="178" class="decision">Decision · 2 actions changed</text>
  </g>

  <g class="sans" transform="translate(430 540)">
    <rect class="card-bg" width="315" height="194" rx="18" stroke="#d7e4e9"/>
    <rect width="8" height="194" rx="4" fill="#3074a7"/>
    <text x="28" y="29" fill="#3074a7" class="eyebrow">SYNTHETIC · PLANNING</text>
    <text x="28" y="62" class="card-title">Spatial planning</text>
    <text x="28" y="92" class="meta">Primary key · site_id</text>
    <text x="28" y="120" class="meta">Checks · demand · travel · flood risk</text>
    <text x="28" y="154" class="result">Committed · 2 claims reversed</text>
    <text x="28" y="178" class="decision">Decision · preferred site changed</text>
  </g>

  <g class="sans" transform="translate(90 762)">
    <rect width="655" height="198" rx="18" fill="#f1f6f9" stroke="#d7e4e9" stroke-width="2"/>
    <text x="28" y="39" fill="#3074a7" font-size="16" font-weight="750" letter-spacing="0.8">WHY KEEP CONTROLLED FIXTURES?</text>
    <text x="28" y="76" fill="#0b2235" font-size="18" font-weight="700">Public data rarely isolates one failure at a time.</text>
    <text x="28" y="111" fill="#496572" font-size="16.5">These cases provide exact expected labels for row reordering, membership changes,</text>
    <text x="28" y="139" fill="#496572" font-size="16.5">missing values, tied ranks, zero baselines, threshold crossings, stale result identity,</text>
    <text x="28" y="167" fill="#496572" font-size="16.5">and decision re-signing. They are regression tests, not real organizations or outcomes.</text>
  </g>

  <!-- Public-data cases -->
  <g class="sans" transform="translate(858 318)">
    <rect class="card-bg" width="315" height="194" rx="18" stroke="#cfe5df"/>
    <rect width="8" height="194" rx="4" fill="#0b8f79"/>
    <text x="28" y="29" fill="#0b8f79" class="eyebrow">WORLD BANK · CC BY 4.0</text>
    <text x="28" y="62" class="card-title">Life expectancy</text>
    <text x="28" y="92" class="meta">Primary key · country_code</text>
    <text x="28" y="120" class="meta">Checks · rank · 81y gate · mean stability</text>
    <text x="28" y="154" class="result">Committed · 1 claim reversed</text>
    <text x="28" y="178" class="decision">Decision · annotate publication note</text>
  </g>

  <g class="sans" transform="translate(1198 318)">
    <rect class="card-bg" width="315" height="194" rx="18" stroke="#cfe5df"/>
    <rect width="8" height="194" rx="4" fill="#0b8f79"/>
    <text x="28" y="29" fill="#0b8f79" class="eyebrow">USDOT / FTA · PUBLIC</text>
    <text x="28" y="62" class="card-title">Transit operations</text>
    <text x="28" y="92" class="meta">Primary key · ntd_id</text>
    <text x="28" y="120" class="meta">Checks · riders/hour · gate · stability</text>
    <text x="28" y="154" class="result">Committed · 1 claim needs review</text>
    <text x="28" y="178" class="decision">Decision · human review required</text>
  </g>

  <g class="sans" transform="translate(858 540)">
    <rect class="card-bg" width="315" height="194" rx="18" stroke="#cfe5df"/>
    <rect width="8" height="194" rx="4" fill="#0b8f79"/>
    <text x="28" y="29" fill="#0b8f79" class="eyebrow">U.S. TREASURY · PUBLIC</text>
    <text x="28" y="62" class="card-title">Yield curve</text>
    <text x="28" y="92" class="meta">Primary key · maturity_code</text>
    <text x="28" y="120" class="meta">Checks · curve rank · 4% gate · mean</text>
    <text x="28" y="154" class="result">Committed · 2 reversed · 1 weakened</text>
    <text x="28" y="178" class="decision">Decision · revise fixed-income brief</text>
  </g>

  <g class="sans" transform="translate(1198 540)">
    <rect class="card-bg" width="315" height="194" rx="18" stroke="#cfe5df"/>
    <rect width="8" height="194" rx="4" fill="#0b8f79"/>
    <text x="28" y="29" fill="#0b8f79" class="eyebrow">CFPB · CC0</text>
    <text x="28" y="62" class="card-title">Card complaints</text>
    <text x="28" y="92" class="meta">Primary key · issue_id</text>
    <text x="28" y="120" class="meta">Checks · issue rank · share · volume</text>
    <text x="28" y="154" class="result">Committed · 1 review · 1 weakened</text>
    <text x="28" y="178" class="decision">Decision · revise consumer brief</text>
  </g>

  <g class="sans" transform="translate(858 762)">
    <rect class="card-bg" width="315" height="194" rx="18" stroke="#cfe5df"/>
    <rect width="8" height="194" rx="4" fill="#0b8f79"/>
    <text x="28" y="29" fill="#0b8f79" class="eyebrow">CDC PLACES · PUBLIC</text>
    <text x="28" y="62" class="card-title">Depression estimates</text>
    <text x="28" y="92" class="meta">Primary key · county_fips</text>
    <text x="28" y="120" class="meta">Checks · county rank · 20% gate · mean</text>
    <text x="28" y="154" class="result">Committed · 1 claim reversed</text>
    <text x="28" y="178" class="decision">Decision · revise surveillance note</text>
  </g>

  <g class="sans" transform="translate(1198 762)">
    <rect class="card-bg" width="315" height="194" rx="18" stroke="#cfe5df"/>
    <rect width="8" height="194" rx="4" fill="#0b8f79"/>
    <text x="28" y="29" fill="#0b8f79" class="eyebrow">ONS · OGL V3.0</text>
    <text x="28" y="62" class="card-title">Housing affordability</text>
    <text x="28" y="92" class="meta">Primary key · authority_code</text>
    <text x="28" y="120" class="meta">Checks · rank · ratio-5 gate · mean</text>
    <text x="28" y="154" class="result">Committed · 1 claim reversed</text>
    <text x="28" y="178" class="decision">Decision · revise planning note</text>
  </g>

  <text x="858" y="1016" fill="#6a7f89" class="sans" font-size="15.5">Descriptive, bounded case selections—not causal studies, client work or adoption evidence.</text>

  <rect x="58" y="1080" width="1484" height="82" rx="20" fill="#e9f0f3" stroke="#d3e0e5" stroke-width="2"/>
  <text x="86" y="1115" fill="#0b2235" class="sans" font-size="17" font-weight="750">EVERY CASE PACK</text>
  <text x="265" y="1115" fill="#496572" class="sans" font-size="17">two snapshots · executable claims and decisions · expected audit · manifest · verified AuditBundle</text>
  <text x="86" y="1147" fill="#0b8f79" class="sans" font-size="17" font-weight="750">PUBLIC CASES ALSO</text>
  <text x="283" y="1147" fill="#496572" class="sans" font-size="17">raw publisher responses · source URLs and license · cleaning log · SHA-256 · declared limits</text>
</svg>
